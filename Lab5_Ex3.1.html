    <style>

        h1 { text-align: center; color: #2c3e50; margin-bottom: 2rem; }

        h2 { color: #2980b9; margin-bottom: 1rem; }
        img { max-width: 100%; height: auto; border-radius: 8px; margin: 1rem 0; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-top: 1rem; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .copyright { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #ddd; color: #7f8c8d; font-size: 0.9rem; }

<body>

        alt="logo">
        <p class="copyright">
            Nguồn: Tạo bởi Canva AI | Ảnh từ Unsplash (Giấy phép Unsplash)</p>

        <h2>🎬 Video giới thiệu</h2>

    <div class="copyright">
